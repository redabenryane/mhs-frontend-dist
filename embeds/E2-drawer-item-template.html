<!-- mhs:embed E2-drawer-item-template v0.1.3 d7db2cb2 -->
<template data-mhs-item id="mhs-quote-item">
    <div class="c-drawer__item">
      <img class="c-drawer__thumb" data-mhs-thumb src="" alt="" width="64" height="64">
      <div class="c-drawer__info">
        <span class="c-drawer__name" data-mhs-name></span>
        <span class="c-drawer__meta" data-mhs-meta></span>
        <span class="c-drawer__meta" data-mhs-size></span>
        <div class="c-stepper" data-size="sm">
          <button class="c-stepper__btn" type="button" data-mhs-minus aria-label="Decrease quantity">−</button>
          <span class="c-stepper__value" data-mhs-qty>1</span>
          <button class="c-stepper__btn" type="button" data-mhs-plus aria-label="Increase quantity">+</button>
        </div>
      </div>
      <button class="c-drawer__remove" type="button" data-mhs-remove aria-label="Remove">×</button>
    </div>
  </template>
